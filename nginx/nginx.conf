worker_processes auto;
events {
    worker_connections   2000;

}
http {
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    # Server 1: HTTP → HTTPS redirect
    server {
        listen 80;
        server_name focustrack.online www.focustrack.online;
        
        # Принудительный редирект на HTTPS
        return 301 https://$host$request_uri;
    }
    server {
        listen              443 ssl;
        server_name focustrack.online www.focustrack.online;
        keepalive_timeout   70;

        ssl_certificate     /etc/nginx/ssl/focustrack.online.crt;
        ssl_certificate_key /etc/nginx/ssl/focustrack.online.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        
        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # Разрешаем popup окна для Google OAuth
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;

        # API proxy - проксирование запросов к backend
        # Backend ожидает /api/v1/..., поэтому проксируем /api на /api
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            # Таймауты для предотвращения 502 ошибок
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Буферизация
            proxy_buffering off;
            proxy_request_buffering off;
            
            # CORS headers для API
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Frontend - проксирование на Vite Dev Server
        # Для production используйте static files вместо этого
        # location / {
        #     proxy_pass http://frontend:5173;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_cache_bypass $http_upgrade;
            
        #     # Заголовки COOP для Google OAuth (если понадобится popup в будущем)
        #     add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        #     add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        # }
        
        # Альтернативный вариант: раздача статики (для production)
        # Раскомментируйте эту секцию и закомментируйте секцию выше для production
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
